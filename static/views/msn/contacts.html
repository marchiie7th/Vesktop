<!doctype html>
<meta charset="utf-8" />
<title>Messenger</title>
<link rel="stylesheet" href="./msn-common.css" />

<!--
    Messenger contact list (step 2).
    Original artwork only: frames, glass and icons are drawn with CSS.
    Your own msn-assets get layered in during step 4.
-->

<style>
    :root {
        --sky-top: #8ccbec;
        --sky-mid: #cfe9f7;
        --paper: #ffffff;
        --ink: #1e2d3b;
        --muted: #6b7f8f;
        --line: #d5e4ee;
        --hover-a: #f1f8fd;
        --hover-b: #dcedf8;
        --select-a: #e2f1fb;
        --select-b: #c4e1f4;
        --select-line: #8fc3e3;

        --online: #3dbb3d;
        --idle: #f0b429;
        --dnd: #e0413a;
        --offline: #a7b1b8;
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        height: 100%;
    }

    body {
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 12.5px;
        color: var(--ink);
        background: var(--paper);
        display: flex;
        flex-direction: column;
        user-select: none;
        overflow: hidden;
    }

    /* ---------- Header: you ---------- */

    header {
        position: relative;
        padding: 14px 14px 12px;
        display: flex;
        gap: 12px;
        align-items: center;
        background:
            radial-gradient(120% 90% at 85% -10%, rgba(255, 255, 255, 0.75), transparent 60%),
            linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 75%, var(--paper) 100%);
    }

    .dp {
        --ring: var(--offline);
        position: relative;
        flex: none;
        width: 72px;
        height: 72px;
        padding: 4px;
        border-radius: 12px;
        background:
            linear-gradient(160deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 45%),
            linear-gradient(180deg, color-mix(in srgb, var(--ring) 70%, white), var(--ring));
        box-shadow:
            0 1px 3px rgba(0, 40, 80, 0.35),
            inset 0 0 0 1px rgba(255, 255, 255, 0.6);
    }

    .dp.small {
        width: 34px;
        height: 34px;
        padding: 2px;
        border-radius: 7px;
        box-shadow:
            0 1px 2px rgba(0, 40, 80, 0.25),
            inset 0 0 0 1px rgba(255, 255, 255, 0.6);
    }

    .dp img,
    .dp .initial {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 8px;
        object-fit: cover;
        background: #e9f2f8;
    }

    .dp.small img,
    .dp.small .initial {
        border-radius: 5px;
    }

    .dp .initial {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 28px;
        color: #5d7d93;
        background: linear-gradient(#f4f9fc, #d9e8f2);
    }

    .dp.small .initial {
        font-size: 14px;
    }

    .online {
        --ring: var(--online);
    }
    .idle {
        --ring: var(--idle);
    }
    .dnd {
        --ring: var(--dnd);
    }
    .offline {
        --ring: var(--offline);
    }

    .me-text {
        min-width: 0;
        flex: 1;
    }

    .me-name {
        font-size: 16px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .me-status {
        font: inherit;
        font-size: 12px;
        font-weight: 400;
        color: #34586f;
        margin-left: 2px;
        padding: 1px 4px;
        border: 1px solid transparent;
        border-radius: 3px;
        background: transparent;
        cursor: pointer;
    }

    .me-status:hover,
    .me-status[aria-expanded="true"] {
        background: rgba(255, 255, 255, 0.6);
        border-color: rgba(60, 130, 180, 0.4);
    }

    .me-status::after {
        content: " ▾";
        font-size: 10px;
    }

    .status-menu {
        position: fixed;
        z-index: 10;
        min-width: 170px;
        padding: 3px;
        background: #fff;
        border: 1px solid #9cc3dc;
        border-radius: 4px;
        box-shadow: 0 3px 10px rgba(0, 40, 80, 0.25);
    }

    .status-menu[hidden] {
        display: none;
    }

    .status-menu button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        font: inherit;
        text-align: left;
        padding: 5px 8px;
        border: 1px solid transparent;
        border-radius: 3px;
        background: transparent;
        cursor: pointer;
    }

    .status-menu button:hover {
        background: linear-gradient(#f1f8fd, #dcedf8);
        border-color: #c9e1f0;
    }

    .status-menu .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--ring);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
    }

    .me-pm {
        cursor: text;
        border: 1px solid transparent;
        border-radius: 3px;
        padding: 1px 3px;
        margin-left: -4px;
    }

    .me-pm:hover {
        border-color: rgba(60, 130, 180, 0.35);
        background: rgba(255, 255, 255, 0.45);
    }

    .me-pm-input {
        width: 100%;
        margin-top: 3px;
        font: inherit;
        font-style: italic;
        padding: 1px 3px;
        border: 1px solid #6fb0d8;
        border-radius: 3px;
        outline: none;
        background: #fff;
    }

    .toast-error {
        margin: 0 10px 6px;
        padding: 5px 8px;
        font-size: 12px;
        color: #8a2f29;
        background: #fdeceb;
        border: 1px solid #efb3ae;
        border-radius: 3px;
    }

    .me-pm {
        margin-top: 3px;
        color: #3f5f74;
        font-style: italic;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .me-pm.empty {
        color: #7f98aa;
    }

    /* ---------- Search ---------- */

    .search {
        padding: 6px 10px 8px;
        border-bottom: 1px solid var(--line);
    }

    .search input {
        width: 100%;
        font: inherit;
        padding: 5px 8px;
        border: 1px solid #b8d0df;
        border-radius: 3px;
        background: linear-gradient(#fbfdfe, #ffffff);
        outline: none;
        user-select: text;
    }

    .search input:focus {
        border-color: #6fb0d8;
        box-shadow: 0 0 0 2px rgba(111, 176, 216, 0.25);
    }

    /* ---------- Contact list ---------- */

    #list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0 8px;
        outline: none;
    }

    .group-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px 3px;
        font-weight: 600;
        color: #2d5873;
        cursor: pointer;
    }

    .group-head:hover {
        color: #1a7bbf;
    }

    .group-head .tri {
        width: 0;
        height: 0;
        border-left: 5px solid currentColor;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        transition: transform 0.12s;
    }

    .group:not(.collapsed) .tri {
        transform: rotate(90deg);
    }

    .group.collapsed .rows {
        display: none;
    }

    .group-head .count {
        font-weight: 400;
        color: var(--muted);
    }

    .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 4px;
        padding: 3px 8px 3px 16px;
        border: 1px solid transparent;
        border-radius: 3px;
        cursor: default;
    }

    .row:hover {
        background: linear-gradient(var(--hover-a), var(--hover-b));
        border-color: #c9e1f0;
    }

    .row.selected {
        background: linear-gradient(var(--select-a), var(--select-b));
        border-color: var(--select-line);
    }

    .row .text {
        min-width: 0;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .row .name {
        font-weight: 600;
    }

    .row.is-offline .name {
        font-weight: 400;
        color: #56697a;
    }

    .row.is-offline .dp {
        filter: grayscale(0.85);
        opacity: 0.75;
    }

    .row .pm {
        color: var(--muted);
    }

    .emo {
        height: 16px;
        vertical-align: -3px;
    }

    .row.signed-in {
        animation: signin 2.4s ease-out;
    }

    @keyframes signin {
        0%,
        20% {
            background: linear-gradient(#fff9d6, #ffeaa0);
            border-color: #f2cf5b;
        }
        100% {
            background: transparent;
            border-color: transparent;
        }
    }

    .empty-note {
        color: var(--muted);
        text-align: center;
        padding: 28px 18px;
        line-height: 1.5;
    }

    /* ---------- Footer ---------- */

    footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        border-top: 1px solid var(--line);
        background: linear-gradient(#ffffff, #eef5fa);
        color: var(--muted);
        font-size: 11.5px;
    }

    footer button {
        font: inherit;
        color: #1a6fa8;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
    }

    footer button:hover {
        text-decoration: underline;
    }
</style>

<div class="titlebar">
    <img class="tb-icon" src="vesktop://static/msn/icon.png" alt="" />
    <span class="tb-title">Messenger</span>
    <div class="tb-buttons">
        <button data-tb="min" type="button" aria-label="Minimize"></button>
        <button data-tb="max" type="button" aria-label="Maximize"></button>
        <button data-tb="close" type="button" aria-label="Close"></button>
    </div>
</div>

<header>
    <div class="dp offline" id="meDp"><div class="initial">?</div></div>
    <div class="me-text">
        <div class="me-name">
            <span id="meName">Signing in…</span
            ><button class="me-status" id="meStatus" type="button" aria-haspopup="menu" aria-expanded="false" hidden></button>
        </div>
        <div class="me-pm empty" id="mePm" title="Click to change your personal message">Waiting for Discord</div>
    </div>
    <div class="status-menu" id="statusMenu" role="menu" hidden>
        <button type="button" role="menuitem" data-status="online" class="online"><span class="dot"></span>Available</button>
        <button type="button" role="menuitem" data-status="idle" class="idle"><span class="dot"></span>Away</button>
        <button type="button" role="menuitem" data-status="dnd" class="dnd"><span class="dot"></span>Busy</button>
        <button type="button" role="menuitem" data-status="invisible" class="offline"><span class="dot"></span>Appear offline</button>
    </div>
</header>
<div class="toast-error" id="meError" hidden></div>

<div class="search">
    <input id="search" type="search" placeholder="Search contacts…" autocomplete="off" spellcheck="false" />
</div>

<div id="list" tabindex="0"></div>

<footer>
    <span id="summary"></span>
    <button id="showDiscord" type="button">Show Discord</button>
</footer>

<script src="./msn-common.js"></script>
<script>
    "use strict";

    const GROUPS = [
        { key: "online", label: "Available" },
        { key: "idle", label: "Away" },
        { key: "dnd", label: "Busy" },
        { key: "offline", label: "Offline" }
    ];
    const STATUS_WORD = { online: "Available", idle: "Away", dnd: "Busy", offline: "Offline" };
    const AVATAR_HOSTS = ["cdn.discordapp.com", "media.discordapp.net"];

    let me = null;
    const friends = new Map();
    let selectedId = null;
    let query = "";
    const justSignedIn = new Map(); // id -> time they came online

    const collapsed = new Set(loadCollapsed());
    let editingPm = false;

    function loadCollapsed() {
        try {
            return JSON.parse(localStorage.getItem("msn.collapsed") || '["offline"]');
        } catch {
            return ["offline"];
        }
    }

    function saveCollapsed() {
        try {
            localStorage.setItem("msn.collapsed", JSON.stringify([...collapsed]));
        } catch {}
    }

    /** Discord status -> one of our four groups */
    function bucket(status) {
        if (status === "online" || status === "streaming") return "online";
        if (status === "idle") return "idle";
        if (status === "dnd") return "dnd";
        return "offline";
    }

    function safeAvatar(url) {
        try {
            const u = new URL(url);
            return u.protocol === "https:" && AVATAR_HOSTS.includes(u.hostname) ? u.href : null;
        } catch {
            return null;
        }
    }

    /** Display picture with status-coloured glass frame */
    function makeDp(person, small) {
        const dp = document.createElement("div");
        dp.className = "dp " + bucket(person.status) + (small ? " small" : "");

        const src = safeAvatar(person.avatarUrl);
        const fallback = () => {
            const initial = document.createElement("div");
            initial.className = "initial";
            initial.textContent = ((person.displayName || "").match(/[\p{L}\p{N}]/u)?.[0] ?? "?").toUpperCase();
            dp.replaceChildren(initial);
        };

        if (src) {
            const img = document.createElement("img");
            img.alt = "";
            img.draggable = false;
            img.referrerPolicy = "no-referrer";
            img.src = src;
            img.onerror = fallback;
            dp.append(img);
        } else {
            fallback();
        }
        return dp;
    }

    function renderMe() {
        if (!me) return;
        const b = bucket(me.status);

        document.getElementById("meDp").replaceWith(Object.assign(makeDp(me), { id: "meDp" }));
        document.getElementById("meName").textContent = me.displayName;
        const statusBtn = document.getElementById("meStatus");
        statusBtn.hidden = false;
        statusBtn.textContent = me.status === "invisible" ? "(Appear offline)" : `(${STATUS_WORD[b]})`;

        const pm = document.getElementById("mePm");
        pm.replaceChildren();
        if (!editingPm) Msn.appendText(pm, me.customStatus || "Share a quick message");
        pm.classList.toggle("empty", !me.customStatus);
        document.title = `Messenger – ${me.displayName}`;
    }

    function matches(f) {
        if (!query) return true;
        return (
            f.displayName.toLowerCase().includes(query) ||
            f.username.toLowerCase().includes(query) ||
            (f.customStatus || "").toLowerCase().includes(query)
        );
    }

    function renderList() {
        const list = document.getElementById("list");
        const scroll = list.scrollTop;
        const byGroup = Object.fromEntries(GROUPS.map(g => [g.key, []]));

        for (const f of friends.values()) if (matches(f)) byGroup[bucket(f.status)].push(f);

        const frag = document.createDocumentFragment();
        let shown = 0;

        for (const g of GROUPS) {
            const people = byGroup[g.key].sort((a, b) =>
                a.displayName.localeCompare(b.displayName, undefined, { sensitivity: "base" })
            );
            if (!people.length && (query || g.key !== "online")) continue;

            const group = document.createElement("section");
            group.className = "group" + (collapsed.has(g.key) && !query ? " collapsed" : "");

            const head = document.createElement("div");
            head.className = "group-head";
            const tri = document.createElement("span");
            tri.className = "tri";
            const label = document.createElement("span");
            label.textContent = g.label;
            const count = document.createElement("span");
            count.className = "count";
            count.textContent = `(${people.length})`;
            head.append(tri, label, count);
            head.addEventListener("click", () => {
                collapsed.has(g.key) ? collapsed.delete(g.key) : collapsed.add(g.key);
                saveCollapsed();
                renderList();
            });

            const rows = document.createElement("div");
            rows.className = "rows";

            for (const f of people) {
                shown++;
                const row = document.createElement("div");
                row.className = "row";
                if (g.key === "offline") row.classList.add("is-offline");
                if (f.id === selectedId) row.classList.add("selected");
                if (justSignedIn.has(f.id)) {
                    // keep the glow's progress across redraws instead of restarting it
                    row.classList.add("signed-in");
                    row.style.animationDelay = `-${Date.now() - justSignedIn.get(f.id)}ms`;
                }
                row.dataset.id = f.id;
                row.title = f.customStatus
                    ? `${f.displayName} (@${f.username})\n${f.customStatus}`
                    : `${f.displayName} (@${f.username})`;

                const text = document.createElement("div");
                text.className = "text";
                const name = document.createElement("span");
                name.className = "name";
                name.textContent = f.displayName;
                text.append(name);
                if (f.customStatus) {
                    const pm = document.createElement("span");
                    pm.className = "pm";
                    Msn.appendText(pm, " - " + f.customStatus);
                    text.append(pm);
                }

                row.append(makeDp(f, true), text);
                rows.append(row);
            }

            group.append(head, rows);
            frag.append(group);
        }

        if (!friends.size) {
            const note = document.createElement("div");
            note.className = "empty-note";
            note.textContent = me ? "No friends yet. Add some in Discord and they'll show up here." : "Waiting for Discord to sign in…";
            frag.replaceChildren(note);
        } else if (!shown && query) {
            const note = document.createElement("div");
            note.className = "empty-note";
            note.textContent = `No contacts match “${query}”.`;
            frag.append(note);
        }

        list.replaceChildren(frag);
        list.scrollTop = scroll;

        const online = [...friends.values()].filter(f => bucket(f.status) !== "offline").length;
        document.getElementById("summary").textContent = friends.size
            ? `${online} of ${friends.size} contacts online`
            : "";
    }

    // Presence bursts (e.g. right after connecting) come in fast; draw at most once per frame.
    let queued = false;
    function scheduleRender() {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => {
            queued = false;
            renderList();
        });
    }

    function select(id) {
        selectedId = id;
        for (const row of document.querySelectorAll(".row")) row.classList.toggle("selected", row.dataset.id === id);
        document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest" });
    }

    function openChat(id) {
        if (id) MsnNative.openChat(id);
    }

    // ---------- Wiring ----------

    MsnNative.onState(state => {
        me = state.me;
        friends.clear();
        for (const f of state.friends) friends.set(f.id, f);
        renderMe();
        renderList();
    });

    MsnNative.onEvent(ev => {
        if (ev.type !== "presence") return;

        const f = friends.get(ev.userId);
        if (!f) return;

        const wasOffline = bucket(f.status) === "offline";
        f.status = ev.status;
        f.customStatus = ev.customStatus;

        if (wasOffline && bucket(ev.status) !== "offline") {
            justSignedIn.set(f.id, Date.now());
            setTimeout(() => justSignedIn.delete(f.id), 2500);
        }
        scheduleRender();
    });

    const list = document.getElementById("list");

    list.addEventListener("click", e => {
        const row = e.target.closest(".row");
        if (row) select(row.dataset.id);
    });

    list.addEventListener("dblclick", e => {
        const row = e.target.closest(".row");
        if (row) openChat(row.dataset.id);
    });

    list.addEventListener("keydown", e => {
        const rows = [...document.querySelectorAll(".group:not(.collapsed) .row")];
        if (!rows.length) return;
        const i = rows.findIndex(r => r.dataset.id === selectedId);

        if (e.key === "ArrowDown") {
            e.preventDefault();
            select(rows[Math.min(i + 1, rows.length - 1)].dataset.id);
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            select(rows[Math.max(i - 1, 0)].dataset.id);
        } else if (e.key === "Enter") {
            openChat(selectedId);
        }
    });

    const search = document.getElementById("search");
    search.addEventListener("input", () => {
        query = search.value.trim().toLowerCase();
        renderList();
    });
    search.addEventListener("keydown", e => {
        if (e.key === "ArrowDown") {
            e.preventDefault();
            const first = document.querySelector(".group:not(.collapsed) .row");
            if (first) {
                select(first.dataset.id);
                list.focus();
            }
        } else if (e.key === "Enter") {
            const first = document.querySelector(".group:not(.collapsed) .row");
            if (first) openChat(first.dataset.id);
        } else if (e.key === "Escape") {
            search.value = "";
            query = "";
            renderList();
        }
    });

    document.getElementById("showDiscord").addEventListener("click", () => MsnNative.showDiscord());

    // ---------- your status & personal message ----------

    function showError(err) {
        const box = document.getElementById("meError");
        box.textContent = String(err?.message || err).replace(/^Error invoking remote method '[^']+': (Error: )?/, "");
        box.hidden = false;
        clearTimeout(showError.timer);
        showError.timer = setTimeout(() => (box.hidden = true), 6000);
    }

    const statusBtn = document.getElementById("meStatus");
    const statusMenu = document.getElementById("statusMenu");

    function setMenu(open) {
        statusMenu.hidden = !open;
        statusBtn.setAttribute("aria-expanded", String(open));
        if (open) {
            const r = statusBtn.getBoundingClientRect();
            statusMenu.style.left = Math.min(r.left, innerWidth - 180) + "px";
            statusMenu.style.top = r.bottom + 3 + "px";
        }
    }

    statusBtn.addEventListener("click", e => {
        e.stopPropagation();
        setMenu(statusMenu.hidden);
    });
    document.addEventListener("click", e => {
        if (!statusMenu.hidden && !statusMenu.contains(e.target)) setMenu(false);
    });
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") setMenu(false);
    });
    statusMenu.addEventListener("click", async e => {
        const item = e.target.closest("[data-status]");
        if (!item) return;
        setMenu(false);
        try {
            await MsnNative.setStatus(item.dataset.status);
        } catch (err) {
            showError(err);
        }
    });

    const pmEl = document.getElementById("mePm");
    pmEl.addEventListener("click", () => {
        if (!me || editingPm) return;
        editingPm = true;

        const input = document.createElement("input");
        input.className = "me-pm-input";
        input.maxLength = 128;
        input.value = me.customStatus || "";
        input.placeholder = "Share a quick message";
        pmEl.hidden = true;
        pmEl.after(input);
        input.focus();
        input.select();

        let done = false;
        const finish = async save => {
            if (done) return;
            done = true;
            const value = input.value.trim();
            input.remove();
            pmEl.hidden = false;
            editingPm = false;
            if (save && value !== (me.customStatus || "")) {
                me.customStatus = value; // show it right away
                renderMe();
                try {
                    await MsnNative.setCustomStatus(value);
                } catch (err) {
                    showError(err);
                }
            } else {
                renderMe();
            }
        };

        input.addEventListener("keydown", e => {
            if (e.key === "Enter") finish(true);
            else if (e.key === "Escape") finish(false);
        });
        input.addEventListener("blur", () => finish(true));
    });

    renderList();
    // redraw once your emoticons / frames are known
    Msn.ready.then(() => {
        renderMe();
        renderList();
    });
</script>
