<!doctype html>
<meta charset="utf-8" />
<title>Messenger</title>

<!-- Corner pop-up: "X has just signed in." / "X says: …" (step 4). Original artwork only. -->

<style>
    :root {
        --online: #3dbb3d;
        --idle: #f0b429;
        --dnd: #e0413a;
        --offline: #a7b1b8;
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    body {
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 12.5px;
        color: #1e2d3b;
        user-select: none;
        padding: 3px;
    }

    .toast {
        position: relative;
        height: 100%;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 26px 10px 10px;
        border-radius: 8px;
        border: 1px solid #8fbfdc;
        background:
            radial-gradient(120% 80% at 80% -20%, rgba(255, 255, 255, 0.9), transparent 60%),
            linear-gradient(180deg, #d5ecf9 0%, #f3f9fd 55%, #ffffff 100%);
        box-shadow: 0 2px 6px rgba(0, 40, 80, 0.3);
        cursor: pointer;
        opacity: 0;
        transform: translateY(24px);
        animation: rise 0.35s ease-out forwards;
    }

    .toast.leaving {
        animation: fall 0.4s ease-in forwards;
    }

    @keyframes rise {
        to {
            opacity: 1;
            transform: none;
        }
    }

    @keyframes fall {
        from {
            opacity: 1;
            transform: none;
        }
        to {
            opacity: 0;
            transform: translateY(12px);
        }
    }

    .toast:hover {
        border-color: #5fa7d3;
    }

    .dp {
        --ring: var(--offline);
        position: relative;
        flex: none;
        width: 58px;
        height: 58px;
        padding: 3px;
        border-radius: 10px;
        background:
            linear-gradient(160deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 45%),
            linear-gradient(180deg, color-mix(in srgb, var(--ring) 70%, white), var(--ring));
        box-shadow:
            0 1px 2px rgba(0, 40, 80, 0.3),
            inset 0 0 0 1px rgba(255, 255, 255, 0.6);
    }

    .dp img,
    .dp .initial {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 7px;
        object-fit: cover;
    }

    .dp .initial {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 24px;
        color: #5d7d93;
        background: linear-gradient(#f4f9fc, #d9e8f2);
    }

    .online {
        --ring: var(--online);
    }
    .idle {
        --ring: var(--idle);
    }
    .dnd {
        --ring: var(--dnd);
    }
    .offline {
        --ring: var(--offline);
    }

    .text {
        min-width: 0;
        flex: 1;
    }

    .title {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .body {
        margin-top: 2px;
        color: #3f5f74;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
    }

    .body .emo {
        height: 16px;
        vertical-align: -3px;
    }

    .close {
        position: absolute;
        top: 4px;
        right: 6px;
        width: 18px;
        height: 18px;
        border: none;
        border-radius: 3px;
        background: transparent;
        color: #5a7a90;
        font-size: 14px;
        line-height: 16px;
        cursor: pointer;
    }

    .close:hover {
        background: rgba(0, 60, 100, 0.1);
    }
</style>

<div class="toast" id="toast">
    <div class="dp offline" id="dp"><div class="initial">?</div></div>
    <div class="text">
        <div class="title" id="title"></div>
        <div class="body" id="body"></div>
    </div>
    <button class="close" id="close" type="button" aria-label="Close">×</button>
</div>

<script src="./msn-common.js"></script>
<script>
    "use strict";

    const AVATAR_HOSTS = ["cdn.discordapp.com", "media.discordapp.net"];

    function bucket(status) {
        if (status === "online" || status === "streaming") return "online";
        if (status === "idle") return "idle";
        if (status === "dnd") return "dnd";
        return "offline";
    }

    function safeAvatar(url) {
        try {
            const u = new URL(url);
            return u.protocol === "https:" && AVATAR_HOSTS.includes(u.hostname) ? u.href : null;
        } catch {
            return null;
        }
    }

    MsnNative.onToast(async toast => {
        const dp = document.getElementById("dp");
        dp.className = "dp " + bucket(toast.person.status);

        const fallback = () => {
            const initial = document.createElement("div");
            initial.className = "initial";
            initial.textContent = ((toast.person.displayName || "").match(/[\p{L}\p{N}]/u)?.[0] ?? "?").toUpperCase();
            dp.replaceChildren(initial);
        };
        const src = safeAvatar(toast.person.avatarUrl);
        if (src) {
            const img = document.createElement("img");
            img.alt = "";
            img.referrerPolicy = "no-referrer";
            img.onerror = fallback;
            img.src = src;
            dp.replaceChildren(img);
        } else {
            fallback();
        }

        document.getElementById("title").textContent = toast.title;

        await Msn.ready; // so emoticons are known
        const body = document.getElementById("body");
        body.replaceChildren();
        Msn.appendText(body, toast.body);

        if (toast.sound) Msn.play(toast.sound);

        // fade out just before the main process closes the window
        setTimeout(() => document.getElementById("toast").classList.add("leaving"), 6500);
    });

    document.getElementById("toast").addEventListener("click", e => {
        if (e.target.closest("#close")) return;
        MsnNative.toastClick();
    });
    document.getElementById("close").addEventListener("click", () => MsnNative.toastClose());
</script>
